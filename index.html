<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>えかきタイプ診断｜32タイプ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Yusei+Magic&family=Zen+Maru+Gothic:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#FFFFFF; --grid:#D6EAF5; --ink:#232733; --sub:#5C6475; --card:#FFFFFFEE;
  --c-o:#FF5C8D; --c-c:#2E9CD6; --c-e:#FFB21E; --c-a:#3DBA6B; --c-n:#8A63DB;
  --agree:#FF5C8D; --disagree:#2E9CD6; --shadow:rgba(35,39,51,.12); --line:#232733;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#191C23; --grid:#262D3B; --ink:#EEF0F6; --sub:#A6ADBD; --card:#20242DEE;
    --shadow:rgba(0,0,0,.35); --line:#EEF0F6;
  }
}
:root[data-theme="dark"]{
  --paper:#191C23; --grid:#262D3B; --ink:#EEF0F6; --sub:#A6ADBD; --card:#20242DEE;
  --shadow:rgba(0,0,0,.35); --line:#EEF0F6;
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  margin:0; min-height:100%; color:var(--ink); background:var(--paper);
  background-image:
    linear-gradient(var(--grid) 1px, transparent 1px),
    linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size:26px 26px;
  font-family:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Hiragino Sans","Noto Sans JP","Yu Gothic",sans-serif;
  font-size:16px; line-height:1.75;
}
.hand{font-family:"Yusei Magic","Zen Maru Gothic","Hiragino Maru Gothic ProN",sans-serif;font-weight:400}
.wrap{max-width:640px;margin:0 auto;padding:24px 18px 56px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible,.blob:focus-visible{outline:3px dashed var(--c-c);outline-offset:3px}
[hidden]{display:none!important}

/* hero */
.hero{text-align:center;padding-top:12px}
.hero h1{font-size:clamp(2.4rem,11vw,3.6rem);line-height:1.1;margin:8px 0 6px;letter-spacing:.02em}
.hero h1 span{display:inline-block}
.hero h1 span:nth-child(1){color:var(--c-o);transform:rotate(-4deg)}
.hero h1 span:nth-child(2){color:var(--c-c);transform:rotate(3deg)}
.hero h1 span:nth-child(3){color:var(--c-e);transform:rotate(-2deg)}
.hero h1 span:nth-child(4){color:var(--c-a);transform:rotate(4deg)}
.hero .lead{color:var(--sub);margin:0 auto 4px;max-width:30em}
.stage{position:relative;width:min(300px,78vw);margin:10px auto 0;background:none;border:0;padding:0;display:block}
.stage svg{width:100%;height:auto;display:block}
.stage.pop svg{animation:pop .45s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{0%{transform:scale(.8) rotate(-6deg)}100%{transform:scale(1) rotate(0)}}
.stage-name{font-size:1.25rem;margin:0}
.stage-hint{font-size:.8rem;color:var(--sub);margin:0 0 18px}
.btns{display:flex;flex-direction:column;gap:12px;align-items:center}
.btn{
  border:3px solid var(--line);background:var(--c-e);color:#232733;border-radius:18px 22px 16px 24px;
  padding:14px 28px;font-weight:700;font-size:1.08rem;min-width:240px;box-shadow:4px 5px 0 var(--line);
  transition:transform .1s, box-shadow .1s;
}
.btn:active{transform:translate(3px,4px);box-shadow:1px 1px 0 var(--line)}
.btn.ghost{background:var(--paper);color:var(--ink)}
.btn.line{background:#06C755;color:#fff;text-decoration:none;display:inline-block}
.btn.small{min-width:0;padding:10px 18px;font-size:.95rem}
.axes-intro{margin:34px 0 0;display:grid;gap:10px}
.axes-intro div{background:var(--card);border:2px solid var(--line);border-radius:14px;padding:10px 14px;display:flex;gap:12px;align-items:center}
.dot{width:18px;height:18px;border-radius:50%;flex:0 0 auto;border:2px solid var(--line)}
.axes-intro b{display:block;font-size:.95rem}
.axes-intro small{color:var(--sub);font-size:.85rem;line-height:1.5;display:block}
.note{font-size:.78rem;color:var(--sub);text-align:center;margin-top:28px;line-height:1.6}

/* quiz */
.qtop{display:flex;align-items:center;justify-content:space-between;gap:10px}
.back{background:none;border:0;color:var(--sub);padding:6px 4px;font-size:.95rem}
.count{font-size:1.1rem}
.progress{display:grid;grid-template-columns:repeat(20,1fr);gap:4px;margin:10px 0 26px}
.progress i{height:8px;border-radius:4px;background:var(--grid);border:1px solid var(--line);opacity:.5}
.progress i.done{opacity:1}
.qcard{background:var(--card);border:3px solid var(--line);border-radius:22px 18px 26px 16px;padding:26px 20px 24px;box-shadow:5px 6px 0 var(--line);position:relative}
.qtag{display:inline-block;font-size:.8rem;font-weight:700;padding:2px 12px;border-radius:999px;border:2px solid var(--line);color:#232733;margin-bottom:12px}
.qtext{font-size:clamp(1.15rem,5vw,1.4rem);font-weight:700;line-height:1.6;margin:0 0 26px;min-height:3.2em}
.scale{display:flex;align-items:center;justify-content:space-between;gap:4px}
.blob{border:3px solid var(--line);border-radius:50%;padding:0;background:transparent;flex:0 0 auto;transition:transform .12s}
.blob:hover{transform:scale(1.08)}
.blob.sel{transform:scale(1.12)}
.blob[data-v="3"],.blob[data-v="-3"]{width:54px;height:54px}
.blob[data-v="2"],.blob[data-v="-2"]{width:44px;height:44px}
.blob[data-v="1"],.blob[data-v="-1"]{width:34px;height:34px}
.blob[data-v^="-"].sel{background:var(--disagree)}
.blob:not([data-v^="-"]).sel{background:var(--agree)}
.blob[data-v^="-"]{border-color:var(--disagree)}
.blob:not([data-v^="-"]){border-color:var(--agree)}
.scale-labels{display:flex;justify-content:space-between;font-size:.85rem;font-weight:700;margin-top:10px}
.scale-labels span:first-child{color:var(--agree)}
.scale-labels span:last-child{color:var(--disagree)}

/* result */
.rhead{text-align:center}
.rhead .kicker{color:var(--sub);margin:0}
.rhead svg{width:min(280px,72vw);height:auto;display:block;margin:0 auto}
.rname{font-size:clamp(2rem,9vw,2.8rem);line-height:1.25;margin:4px 0 6px}
.rcatch{font-weight:700;margin:0 auto 14px;max-width:26em}
.chips{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.chip{font-size:.82rem;font-weight:700;padding:3px 12px;border-radius:999px;border:2px solid var(--line);color:#232733}
.code{font-size:.85rem;color:var(--sub);letter-spacing:.2em;margin-top:8px}
.sec{margin-top:30px;background:var(--card);border:3px solid var(--line);border-radius:20px 16px 24px 18px;padding:20px 18px}
.sec h2{font-size:1.35rem;margin:0 0 14px;font-weight:400}
.bar{margin-bottom:16px}
.bar:last-child{margin-bottom:0}
.bar-top{display:flex;justify-content:space-between;font-size:.85rem;font-weight:700}
.bar-top .win{text-decoration:underline wavy;text-underline-offset:4px}
.track{position:relative;height:14px;border:2px solid var(--line);border-radius:8px;background:var(--paper);margin-top:4px;overflow:hidden}
.track b{position:absolute;inset:0 auto 0 0;border-radius:6px 0 0 6px}
.bar small{display:block;font-size:.75rem;color:var(--sub);text-align:center}
.trait{display:flex;gap:12px;margin-bottom:14px}
.trait:last-child{margin-bottom:0}
.trait .dot{margin-top:6px}
.trait b{display:block}
.trait p{margin:2px 0 0;font-size:.95rem}
.aru{list-style:none;margin:0;padding:0}
.aru li{padding:9px 0 9px 32px;position:relative;border-bottom:2px dashed var(--grid);font-size:.98rem}
.aru li:last-child{border-bottom:0}
.aru li::before{content:"";position:absolute;left:2px;top:13px;width:18px;height:18px;border:2.5px solid var(--line);border-radius:5px}
.aru li::after{content:"";position:absolute;left:7px;top:12px;width:8px;height:14px;border:solid var(--c-o);border-width:0 4px 4px 0;transform:rotate(40deg)}
.quote{position:relative;display:inline-block;background:var(--paper);border:3px solid var(--line);border-radius:22px;padding:8px 18px;font-size:1.1rem;margin:0 auto 6px;max-width:92%}
.quote::after{content:"";position:absolute;left:50%;bottom:-12px;width:18px;height:18px;background:var(--paper);border-right:3px solid var(--line);border-bottom:3px solid var(--line);transform:translateX(-50%) rotate(45deg)}
.sec .intro{font-size:.9rem;color:var(--sub);margin:-6px 0 12px}
.pts{list-style:none;margin:0;padding:0}
.pts li{display:flex;gap:10px;padding:8px 0;border-bottom:2px dashed var(--grid);font-size:.96rem}
.pts li:last-child{border-bottom:0}
.pts .mk{flex:0 0 auto;width:26px;height:26px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-size:.8rem;font-weight:700;color:#232733;margin-top:2px}
.pts small{display:block;font-size:.75rem;color:var(--sub);font-weight:700}
.odai{display:grid;gap:10px}
.odai div{border:2.5px dashed var(--line);border-radius:14px;padding:10px 14px;font-weight:700;background:var(--paper)}
.odai small{display:block;font-weight:500;color:var(--sub);font-size:.78rem}
.pals{display:grid;gap:10px}
.deep p{margin:0 0 6px;font-size:1rem;line-height:1.95}
.deep h3{font-size:1rem;margin:18px 0 4px;padding-left:10px;border-left:5px solid var(--c-o)}
.pal .role{display:inline-block;font-size:.72rem;font-weight:700;border:2px solid var(--line);border-radius:999px;padding:0 8px;margin-bottom:2px}
.pal{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:var(--paper);border:2px solid var(--line);border-radius:16px;padding:8px 12px}
.pal svg{width:84px;height:84px;flex:0 0 auto}
.pal b{display:block;font-size:1.1rem}
.pal small{color:var(--sub);font-size:.85rem;line-height:1.5;display:block}
.rbtns{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;margin-top:28px}
.toast{text-align:center;font-size:.85rem;color:var(--c-a);min-height:1.4em;margin-top:8px}

/* zukan */
.zhead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:6px}
.zhead h2{font-size:1.8rem;margin:0;font-weight:400}
.zfilter{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 18px}
.zfilter button{border:2px solid var(--line);background:var(--paper);border-radius:999px;padding:3px 12px;font-size:.82rem;font-weight:700}
.zfilter button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px}
.zc{background:var(--card);border:2px solid var(--line);border-radius:16px;padding:8px 8px 12px;text-align:center}
.zc svg{width:100%;height:auto;display:block}
.zc b{display:block;font-size:.92rem;line-height:1.4}
.zc small{color:var(--sub);font-size:.72rem;letter-spacing:.15em}

@media (prefers-reduced-motion: reduce){
  *{animation:none!important;transition:none!important}
}
</style>
</head>
<body>

<!-- HOME -->
<section class="view" id="home">
  <div class="wrap">
    <div class="hero">
      <h1 class="hand"><span>え</span><span>か</span><span>き</span><span>タ</span>イプ診断</h1>
      <p class="lead">20の質問で、あなたの描き方・絵との向き合い方を32タイプに分けます。所要時間はだいたい3分。</p>
      <button class="stage" id="stage" aria-label="別のタイプのキャラクターを表示"></button>
      <p class="stage-name hand" id="stageName"></p>
      <p class="stage-hint">キャラをタップすると他のタイプに変わります</p>
      <div class="btns">
        <button class="btn" id="startBtn">診断をはじめる</button>
        <button class="btn ghost" id="lastBtn" hidden>前回の結果を見る</button>
        <button class="btn ghost" id="zukanBtn">32タイプ図鑑を見る</button>
      </div>
    </div>

    <div class="axes-intro" id="axesIntro"></div>

    <p class="note">心理学のビッグファイブ（性格の5因子）の考え方をもとに、絵描き向けにアレンジした“あそびの診断”です。<br>学術的に検証された検査ではないので、ゆるく楽しんでください。</p>
  </div>
</section>

<!-- QUIZ -->
<section class="view" id="quiz" hidden>
  <div class="wrap">
    <div class="qtop">
      <button class="back" id="qBack">もどる</button>
      <span class="count hand" id="qCount">1 / 20</span>
      <span style="width:48px"></span>
    </div>
    <div class="progress" id="progress"></div>
    <div class="qcard">
      <span class="qtag" id="qTag"></span>
      <p class="qtext" id="qText"></p>
      <div class="scale" id="scale" role="group" aria-label="どのくらい当てはまるか"></div>
      <div class="scale-labels"><span>あてはまる</span><span>あてはまらない</span></div>
    </div>
  </div>
</section>

<!-- RESULT -->
<section class="view" id="result" hidden>
  <div class="wrap" id="resultBody"></div>
</section>

<!-- ZUKAN -->
<section class="view" id="zukan" hidden>
  <div class="wrap">
    <div class="zhead">
      <h2 class="hand">32タイプ図鑑</h2>
      <button class="btn ghost small" id="zBack">トップへ</button>
    </div>
    <div class="zfilter" id="zfilter"></div>
    <div class="grid" id="grid"></div>
  </div>
</section>

<script>
const AX = [
  {k:'開放性', q:'新しさ', color:'var(--c-o)', poles:[
    {c:'X', n:'実験派', d:'「新しい」がガソリン。画材も画風もどんどん試すので、引き出しの多さは誰にも負けません。そのぶん画風迷子になる日も。',
     a:['無料ブラシを大量にDLして、結局使うのは2本だけ','描くたびに「絵柄変わった？」と言われる','「今度これ描いてみよう」メモが無限に増えていく']},
    {c:'K', n:'王道派', d:'好きなものを、好きな描き方で、深く。同じモチーフを描き重ねるうちに、気づけば精度が職人レベルに。',
     a:['使っているブラシが何年も前から同じ','推しを描いた枚数がもう数えられない','右向きの顔ばかり上手くなっていく']}
  ]},
  {k:'誠実性', q:'進め方', color:'var(--c-c)', poles:[
    {c:'P', n:'計画派', d:'ラフ→線画→塗りの工程がきれい。完成まで持っていく力が強い反面、準備だけで満足しそうになる日もあります。',
     a:['資料フォルダだけで容量を圧迫している','レイヤーがきっちりフォルダ分けされている','正直ラフの段階がいちばん楽しい']},
    {c:'I', n:'勢い派', d:'ひらめいた瞬間がいちばん強い。深夜のテンションで名作が生まれる一方、描きかけフォルダもすくすく育ちます。',
     a:['「レイヤー1」に全部描いている','描きかけのファイルが完成品より多い','気づいたら朝の4時']}
  ]},
  {k:'外向性', q:'見せ方', color:'var(--c-e)', poles:[
    {c:'S', n:'発信派', d:'描いたら見てほしい。反応が燃料になって、仲間とワイワイ描くほど筆がのるタイプです。',
     a:['投稿時間を見られやすい時間帯に合わせがち','作業通話がないと集中できない','途中経過もついつい上げちゃう']},
    {c:'H', n:'秘蔵派', d:'絵は自分との対話。見せるより描くこと自体が楽しくて、フォルダの中に宝物が眠っています。',
     a:['スマホの写真フォルダが落書きで埋まっている','投稿ボタンの前で30分悩んで、そっと閉じる','「絵描けたの！？」と後から驚かれる']}
  ]},
  {k:'協調性', q:'描くもの', color:'var(--c-a)', poles:[
    {c:'Y', n:'寄り添い派', d:'誰かのための一枚がいちばん描ける。お題やリクエスト、流行りを上手に拾える、見る人目線の人です。',
     a:['誕生日絵を頼まれると張り切りすぎる','流行りのお題タグにすぐ乗る','「描いてほしいキャラいる？」とつい聞いちゃう']},
    {c:'W', n:'我が道派', d:'描きたいものしか描かない、それがあなたの強さ。刺さる人には深く深く刺さる作風です。',
     a:['自分の好みにしか反応しない筆','流行りに乗り遅れても特に気にしない','マイナーなジャンルを一人で耕している']}
  ]},
  {k:'情緒安定性', q:'心の動き', color:'var(--c-n)', poles:[
    {c:'T', n:'泰然派', d:'評価に振り回されず、マイペースに描き続けられる。長く続けること自体が才能だとしたら、あなたはかなり強い。',
     a:['いいねの数を見ずにアプリを閉じられる','スランプ中は普通に他の趣味を楽しんでる','何年たっても楽しそうに描いている']},
    {c:'J', n:'情熱派', d:'心が大きく動くぶん、絵にも熱がこもる。へこんだ夜も、悔しさを燃料に変えて伸びていくタイプです。',
     a:['すごい絵を見てへこみ、30分後には模写している','投稿後、5分おきに通知を確認してしまう','昨日の自分の絵を見て布団の中で叫ぶ']}
  ]}
];

// key: 1 = poles[0] 寄り, -1 = poles[1] 寄り
const Q = [
  {t:'新しいブラシやアプリを見つけると、とりあえず試したくなる', ax:0, key:1},
  {t:'描き始める前に、ラフや資料集めをしっかりやる', ax:1, key:1},
  {t:'描き上げたら、その日のうちにSNSに上げたい', ax:2, key:1},
  {t:'リクエストやお題をもらうと、むしろ描きやすい', ax:3, key:1},
  {t:'いいねが少なくても、あまり気にならない', ax:4, key:1},
  {t:'気づけばいつも同じアングル・同じ構図で描いている', ax:0, key:-1},
  {t:'レイヤー名は「レイヤー87」のまま放置しがち', ax:1, key:-1},
  {t:'描いた絵のほとんどは、誰にも見せずに眠っている', ax:2, key:-1},
  {t:'流行りのジャンルより、自分の好きなものしか描けない', ax:3, key:-1},
  {t:'すごい人の絵を見ると、しばらく描く気がなくなる', ax:4, key:-1},
  {t:'描いたことのないジャンル（背景・メカ・動物など）にも手を出したい', ax:0, key:1},
  {t:'「今月は何枚」みたいな目標を決めて、わりと守れる', ax:1, key:1},
  {t:'絵描き仲間と通話しながら作業するのが好き', ax:2, key:1},
  {t:'見た人が喜んでくれそうかを考えながら描く', ax:3, key:1},
  {t:'描けない時期がきても「まあそのうち描ける」と思える', ax:4, key:1},
  {t:'「いつもの絵柄」がいちばん落ち着くし、あまり変えたくない', ax:0, key:-1},
  {t:'途中で飽きて、描きかけのファイルがたまっていく', ax:1, key:-1},
  {t:'作業中の画面を人にのぞかれると、手が止まる', ax:2, key:-1},
  {t:'「もっとこうしたら」と言われても、自分の解釈は曲げたくない', ax:3, key:-1},
  {t:'昨日描いた絵が、今日見るとすごく下手に見える', ax:4, key:-1}
];

const TYPES = {
  XPSYT:['企画屋プロデューサー','新しいことを思いついて、みんなを巻き込んで、ちゃんと形にする人。',['合同企画の主催をやりがち','企画のスケジュール表を作るのがちょっと楽しい']],
  XPSYJ:['全力イベンター','誰かを喜ばせたくて、毎回ちょっと無茶な挑戦をしちゃう人。',['企画の前夜は不安で眠れない','反応が温かすぎて画面の前で泣く']],

    s += `<circle cx="72" cy="24" r="5" fill="var(--c-e)"/><circle cx="182" cy="96" r="4.5" fill="var(--c-c)"/><circle cx="20" cy="152" r="4" fill="var(--c-a)"/><circle cx="186" cy="164" r="3.5" fill="var(--c-o)"/><circle cx="60" cy="36" r="2.5" fill="var(--c-n)"/>`;
  } else {
    s += `<g transform="rotate(35 150 62)"><rect x="143" y="32" width="14" height="50" fill="var(--c-e)" stroke="${ink}" stroke-width="3"/><path d="M143 82 L150 98 L157 82Z" fill="#F6D8B2" stroke="${ink}" stroke-width="3" stroke-linejoin="round"/><path d="M148 93 L150 98 L152 93Z" fill="${ink}"/><rect x="143" y="24" width="14" height="9" rx="2" fill="var(--c-o)" stroke="${ink}" stroke-width="3"/></g>`;
  }
  // 誠実性（勢い派は絵の具汚れ）
  if (c==='I') s += `<circle cx="52" cy="142" r="6" fill="var(--c-o)"/><circle cx="148" cy="152" r="5" fill="var(--c-c)"/><circle cx="58" cy="160" r="3.5" fill="var(--c-e)"/><circle cx="140" cy="84" r="4" fill="var(--c-n)"/>`;
  // 目
  if (n==='T') s += `<path d="M70 114 q8 -9 16 0 M114 114 q8 -9 16 0" fill="none" stroke="${ink}" stroke-width="3.8" stroke-linecap="round"/>`;
  else s += `<circle cx="78" cy="112" r="8" fill="${ink}"/><circle cx="81" cy="108.5" r="3" fill="#fff"/><circle cx="122" cy="112" r="8" fill="${ink}"/><circle cx="125" cy="108.5" r="3" fill="#fff"/>`;
  if (c==='P') s += `<circle cx="78" cy="112" r="15" fill="none" stroke="${ink}" stroke-width="3"/><circle cx="122" cy="112" r="15" fill="none" stroke="${ink}" stroke-width="3"/><path d="M93 110 q7 -5 14 0" fill="none" stroke="${ink}" stroke-width="3"/>`;
  s += `<ellipse cx="60" cy="130" rx="7" ry="4" fill="#FF8FA8" opacity=".7"/><ellipse cx="140" cy="130" rx="7" ry="4" fill="#FF8FA8" opacity=".7"/>`;
  if (n==='T') s += `<path d="M92 131 q8 7 16 0" fill="none" stroke="${ink}" stroke-width="3.2" stroke-linecap="round"/>`;
  else s += `<path d="M90 128 q10 13 20 0 z" fill="${ink}" stroke="${ink}" stroke-width="2" stroke-linejoin="round"/>`;
  // 外向性
  if (e==='S'){
    s += `<path d="M46 132 L30 104" stroke="${ink}" stroke-width="4" stroke-linecap="round"/>`;
    s += `<rect x="15" y="64" width="28" height="42" rx="6" fill="var(--paper)" stroke="${ink}" stroke-width="3"/><path d="M22 76 h14 M22 84 h10" stroke="var(--c-e)" stroke-width="3" stroke-linecap="round"/><path d="M29 94 l0 0" stroke="${ink}" stroke-width="4" stroke-linecap="round"/>`;
    s += `<path d="M8 58 l-5 -5 M16 52 l0 -7 M46 58 l5 -5" stroke="var(--c-e)" stroke-width="3" stroke-linecap="round"/>`;
  } else {
    s += `<rect x="62" y="138" width="76" height="44" rx="4" fill="var(--paper)" stroke="${ink}" stroke-width="3"/>`;
    for (let x=72; x<=128; x+=11) s += `<circle cx="${x}" cy="138" r="3" fill="var(--paper)" stroke="${ink}" stroke-width="2"/>`;
    s += `<path d="M76 158 q10 -10 20 0 t20 0" fill="none" stroke="var(--c-o)" stroke-width="3" stroke-linecap="round"/>`;
    s += `<circle cx="62" cy="160" r="7" fill="${body}" stroke="${ink}" stroke-width="3"/><circle cx="138" cy="160" r="7" fill="${body}" stroke="${ink}" stroke-width="3"/>`;
  }
  // 協調性
  if (a==='Y') s += `<path d="M34 46 C18 34 22 20 34 27 C46 20 50 34 34 46Z" fill="#FF7A9C" stroke="${ink}" stroke-width="2.5" stroke-linejoin="round"/>`;
  // 情熱派の炎
  if (n==='J') s += `<path d="M100 4 C111 16 115 26 109 35 C104 42 96 42 91 35 C85 26 91 17 96 21 C96 13 98 9 100 4Z" fill="#FF8A3D" stroke="${ink}" stroke-width="2.5" stroke-linejoin="round"/><path d="M100 22 C104 28 104 33 100 36 C96 33 96 28 100 22Z" fill="#FFD23F"/>`;
  s += `</svg>`;
  return s;
}

/* ---------- view helpers ---------- */
function show(id){
  document.querySelectorAll('.view').forEach(v => v.hidden = v.id !== id);
  window.scrollTo(0,0);
}
function esc(t){ return String(t).replace(/[&<>"]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m])); }

/* ---------- home ---------- */
const stage = document.getElementById('stage');
function setStage(code){
  stage.innerHTML = charSVG(code);
  document.getElementById('stageName').textContent = TYPES[code][0];
  stage.classList.remove('pop'); void stage.offsetWidth; stage.classList.add('pop');
}
let stageCode = CODES[Math.floor(Math.random()*32)];
setStage(stageCode);
stage.addEventListener('click', () => {
  let next; do { next = CODES[Math.floor(Math.random()*32)]; } while (next === stageCode);
  stageCode = next; setStage(next);
});

document.getElementById('axesIntro').innerHTML = AX.map(ax =>
  `<div><span class="dot" style="background:${ax.color}"></span><span><b>${ax.q}：${ax.poles[0].n} ⇔ ${ax.poles[1].n}</b><small>${ax.k}をもとにした軸</small></span></div>`
).join('');

/* ---------- quiz ---------- */
let answers = new Array(Q.length).fill(null);
let qi = 0;
const VALS = [3,2,1,-1,-2,-3];

function renderQ(){
  const q = Q[qi], ax = AX[q.ax];
  document.getElementById('qCount').textContent = `${qi+1} / ${Q.length}`;
  const tag = document.getElementById('qTag');
  tag.textContent = ax.q; tag.style.background = ax.color;
  document.getElementById('qText').textContent = q.t;
  document.getElementById('progress').innerHTML = Q.map((qq,i) =>
    `<i class="${i<qi || answers[i]!==null ? 'done':''}" style="background:${i<=qi||answers[i]!==null ? AX[qq.ax].color : ''}"></i>`).join('');
  const labels = ['とてもあてはまる','あてはまる','ややあてはまる','ややあてはまらない','あてはまらない','まったくあてはまらない'];
  document.getElementById('scale').innerHTML = VALS.map((v,i) =>
    `<button class="blob ${answers[qi]===v?'sel':''}" data-v="${v}" aria-label="${labels[i]}"></button>`).join('');
  document.getElementById('qBack').style.visibility = 'visible';
}
document.getElementById('scale').addEventListener('click', ev => {
  const b = ev.target.closest('.blob'); if (!b) return;
  answers[qi] = Number(b.dataset.v);
  b.classList.add('sel');
  setTimeout(() => {
    if (qi < Q.length-1){ qi++; renderQ(); }
    else finish();
  }, 180);
});
document.getElementById('qBack').addEventListener('click', () => {
  if (qi === 0) { show('home'); return; }
  qi--; renderQ();
});
document.getElementById('startBtn').addEventListener('click', () => {
  answers = new Array(Q.length).fill(null); qi = 0; renderQ(); show('quiz');
});

function finish(){
  const sc = [0,0,0,0,0], first = [null,null,null,null,null];
  Q.forEach((q,i) => {
    const v = answers[i] * q.key;
    sc[q.ax] += v;
    if (first[q.ax] === null) first[q.ax] = v;
  });
  const code = AX.map((ax,i) => {
    const s = sc[i] !== 0 ? sc[i] : first[i];
    return s > 0 ? ax.poles[0].c : ax.poles[1].c;
  }).join('');
  const pct = sc.map(s => Math.round((s + 12) / 24 * 100));
  try { localStorage.setItem('ekaki-last', JSON.stringify({code, pct})); } catch(e){}
  renderResult(code, pct, true);
}

/* ---------- result ---------- */
function renderResult(code, pct, mine){
  const [name, catchline] = TYPES[code];
  const idx = CODES.indexOf(code);
  const chips = AX.map((ax,i) => `<span class="chip" style="background:${ax.color}">${pole(code,i).n}</span>`).join('');

  let bars = '';
  if (pct){
    bars = `<div class="sec"><h2 class="hand">あなたのバランス</h2>` + AX.map((ax,i) => {
      const leftWin = code[i] === ax.poles[0].c;
      return `<div class="bar"><div class="bar-top"><span class="${leftWin?'win':''}">${ax.poles[0].n}</span><span class="${leftWin?'':'win'}">${ax.poles[1].n}</span></div>
        <div class="track" role="img" aria-label="${ax.poles[0].n} ${pct[i]}%"><b style="width:${pct[i]}%;background:${ax.color}"></b></div>
        <small>${ax.poles[0].n} ${pct[i]}% ／ ${ax.poles[1].n} ${100-pct[i]}%</small></div>`;
    }).join('') + `</div>`;
  }

  const traits = AX.map((ax,i) => {
    const p = pole(code,i);
    return `<div class="trait"><span class="dot" style="background:${ax.color}"></span><div><b>${ax.q}：${p.n}</b><p>${p.d}</p></div></div>`;
  }).join('');

  const tx = TX[code];
  const dp = DEEP[code];
  const shareText = `わたしの絵描きタイプは「${name}」でした！\n${catchline}\n\n結果の詳しい解説はこちら👇\n${SHARE_URL}?t=${code}\n#えかきタイプ診断`;

  const flip = (cd, is) => cd.split('').map((ch,i) => is.includes(i) ? (AX[i].poles[0].c===ch ? AX[i].poles[1].c : AX[i].poles[0].c) : ch).join('');
  const list = key => `<ul class="pts">` + AX.map((ax,i) => {
    const p = pole(code,i);
    return `<li><span class="mk" style="background:${ax.color}">${p.n[0]}</span><span><small>${p.n}</small>${PX[p.c][key]}</span></li>`;
  }).join('') + `</ul>`;
  const odai = [0,2,3].map((i,j) => { const p = pole(code,i); return `<div>${PX[p.c].t[(idx+j)%2]}<small>${p.n}のあなたに</small></div>`; }).join('');
  const pals = [
    [flip(code,[1,2]), '相棒', '好みは近いのに、進め方と見せ方が真逆。足りないところを自然に補い合える組み合わせです。'],
    [flip(code,[0,3]), 'ライバル', '同じ熱量で、まったく違う方向を向いている相手。作品を見るたびに刺激をもらえます。'],
    [flip(code,[4]), 'そっくりさん', '描き方はほぼ同じ。心の動き方だけが違うので、話すと「わかる！」が止まりません。']
  ];

  document.getElementById('resultBody').innerHTML = `
    <div class="rhead">
      <p class="kicker">${mine ? 'あなたの絵描きタイプは…' : (renderResult.friend ? '友達の絵描きタイプは…' : 'タイプ図鑑')}</p>
      ${charSVG(code)}
      <div class="quote hand">「${tx[0]}」</div>
      <h1 class="rname hand">${name}</h1>
      <p class="rcatch">${catchline}</p>
      <div class="chips">${chips}</div>
      <div class="code">${code}</div>
    </div>
    <div class="sec deep"><h2 class="hand">${name}ってどんな人？</h2>
      <p>${dp[0]}</p>
      <h3>描いているときのあなた</h3><p>${dp[1]}</p>
      <h3>周りから見たあなた</h3><p>${dp[2]}</p>
      <h3>あなたが一番輝く瞬間</h3><p>${dp[3]}</p>
    </div>
    ${bars}
    <div class="sec"><h2 class="hand">5つの軸で見るあなたの描き方</h2>${traits}</div>
    <div class="sec"><h2 class="hand">あなたの強み</h2>${list('s')}</div>
    <div class="sec"><h2 class="hand">ちょっと気をつけたいところ</h2><p class="intro">弱点というより、強みの裏側です。</p>${list('w')}</div>
    <div class="sec"><h2 class="hand">もっと伸びるためのヒント</h2>${list('h')}</div>
    <div class="sec"><h2 class="hand">描けないときの処方箋</h2><p class="intro">スランプが来たら、どれかひとつ試してみてください。</p>${list('r')}</div>
    <div class="sec"><h2 class="hand">次に描いてみたいお題</h2><div class="odai">${odai}</div></div>
    <div class="sec"><h2 class="hand">相性のいいタイプ</h2><div class="pals">
      ${pals.map(([c,r,d]) => `<button class="pal" data-code="${c}">${charSVG(c)}<span><span class="role">${r}</span><b>${TYPES[c][0]}</b><small>${d}</small></span></button>`).join('')}
    </div></div>
    <div class="rbtns">
      ${mine ? `<a class="btn small line" id="lineBtn" target="_blank" rel="noopener" href="https://line.me/R/share?text=${encodeURIComponent(shareText)}">LINEで送る</a>
      <button class="btn small" id="shareBtn">ほかのアプリで共有</button>
      <button class="btn ghost small" id="copyBtn">結果をコピー</button>` : ''}
      <button class="btn ${renderResult.friend ? '' : 'ghost '}small" id="retryBtn">${mine ? 'もう一度診断する' : '自分も診断する'}</button>
      <button class="btn ghost small" id="toZukan">32タイプ図鑑</button>
      <button class="btn ghost small" id="toHome">トップへ</button>
    </div>
    <p class="toast" id="toast" aria-live="polite"></p>`;

  const body = document.getElementById('resultBody');
  body.querySelectorAll('.pal').forEach(b => b.addEventListener('click', e => renderResult(e.currentTarget.dataset.code, null, false)));
  body.querySelector('#retryBtn').addEventListener('click', () => document.getElementById('startBtn').click());
  body.querySelector('#toZukan').addEventListener('click', () => { renderZukan(); show('zukan'); });
  body.querySelector('#toHome').addEventListener('click', () => { refreshLast(); show('home'); });
  const sb = body.querySelector('#shareBtn');
  if (sb) sb.addEventListener('click', async () => {
    const t = document.getElementById('toast');
    if (navigator.share){
      try { await navigator.share({text: shareText}); } catch(e){}
    } else {
      try { await navigator.clipboard.writeText(shareText); t.textContent = 'この端末では共有メニューが使えないので、文章をコピーしました'; }
      catch(e){ t.textContent = '共有できませんでした。「結果をコピー」を使ってください'; }
    }
  });
  const cb = body.querySelector('#copyBtn');
  if (cb) cb.addEventListener('click', async () => {
    const text = shareText;
    const t = document.getElementById('toast');
    try { await navigator.clipboard.writeText(text); t.textContent = 'コピーしました'; }
    catch(e){ t.textContent = 'コピーできませんでした。長押しで選択してコピーしてください'; }
  });
  show('result');
}

/* ---------- zukan ---------- */
let zf = 'all';
function renderZukan(){
  const filters = [['all','ぜんぶ'], ...AX.flatMap(ax => ax.poles.map(p => [p.c, p.n]))];
  document.getElementById('zfilter').innerHTML = filters.map(([k,l]) =>
    `<button data-f="${k}" aria-pressed="${zf===k}">${l}</button>`).join('');
  document.getElementById('grid').innerHTML = CODES.filter(c => zf==='all' || c.includes(zf)).map(c =>
    `<button class="zc" data-code="${c}">${charSVG(c)}<b>${TYPES[c][0]}</b><small>${c}</small></button>`).join('');
}
document.getElementById('zfilter').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  zf = b.dataset.f; renderZukan();
});
document.getElementById('grid').addEventListener('click', e => {
  const b = e.target.closest('.zc'); if (!b) return;
  renderResult(b.dataset.code, null, false);
});
document.getElementById('zukanBtn').addEventListener('click', () => { renderZukan(); show('zukan'); });
document.getElementById('zBack').addEventListener('click', () => { refreshLast(); show('home'); });

/* ---------- last result ---------- */
function refreshLast(){
  const btn = document.getElementById('lastBtn');
  let last = null;
  try { last = JSON.parse(localStorage.getItem('ekaki-last') || 'null'); } catch(e){}
  if (last && TYPES[last.code]){
    btn.hidden = false;
    btn.onclick = () => renderResult(last.code, last.pct, true);
  } else btn.hidden = true;
}
refreshLast();

/* ---------- 共有リンクから開いたとき ---------- */
(function(){
  let t = null;
  try {
    const q = new URLSearchParams(location.search);
    t = q.get('t');
    if (!t && location.hash) t = new URLSearchParams(location.hash.slice(1)).get('t');
  } catch(e){}
  if (t && TYPES[t.toUpperCase()]){
    renderResult.friend = true;
    renderResult(t.toUpperCase(), null, false);
    renderResult.friend = false;
  }
})();
</script>
</body>
</html>
